<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material responsive video sample</title>
<style>
  html, body { margin: 0; height: 100%; background: #00595f; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<video controls muted playsinline preload="none" poster="sample-poster.svg" aria-label="Local silent video sample">
  <source src="sample.mp4" type="video/mp4">
</video>
</body>
</html>
