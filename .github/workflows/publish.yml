name: Publish

# Publishes the library snapshots to packages.instanto.io, the destination every
# project inherits from instanto-org-pom. The showcases, probes and audit modules
# set maven.deploy.skip themselves and are not published.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshots:
    name: packages.instanto.io
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Deploy snapshots to packages.instanto.io
      goals: clean deploy
      fast-deploy: true
      downstream-checks: false
      sonar: false
      timeout-minutes: 30
    secrets: inherit

  consumer:
    name: Published Hello Material
    if: github.event_name == 'workflow_dispatch'
    needs: snapshots
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Build Hello Material from published snapshots
      goals: clean verify
      downstream-checks: false
      sonar: false
      maven-args: -f examples/hello-material/pom.xml -Dmaven.repo.local=$RUNNER_TEMP/material-consumer-m2
      timeout-minutes: 30
    secrets: inherit
