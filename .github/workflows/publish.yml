name: Publish

# Publishes the libraries to packages.instanto.io after CI. The showcases,
# probes and audit modules set maven.deploy.skip themselves and are not published.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-snapshot:
    name: Instanto snapshots
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Deploy to packages.instanto.io
      goals: clean deploy
      maven-args: -DskipTests
      timeout-minutes: 30
    secrets: inherit
