name: Publish

# Publishes the library snapshots to packages.instanto.io, the destination every
# project inherits from instanto-org-pom. The showcases, probes and audit modules
# set maven.deploy.skip themselves and are not published.
#
# Snapshots go out on every push to main once CI has passed.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshots:
    name: packages.instanto.io
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Deploy snapshots to packages.instanto.io
      goals: clean deploy
      maven-args: -DskipTests
      timeout-minutes: 30
    secrets: inherit
