name: CI

# Builds and tests the port on the organisation's container runners, which carry
# the browsers the TeaVM tests drive. The parents and teavm-compat resolve from
# packages.instanto.io.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Build the port and run its tests
      goals: clean verify
      downstream-checks: false
      sonar: false
      timeout-minutes: 45
    secrets: inherit

  browser-contracts:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [ development, production ]
        browser: [ chrome, firefox, webkit ]
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: ${{ matrix.mode }} ${{ matrix.browser }} showcase contracts
      goals: clean verify
      downstream-checks: false
      sonar: false
      install-playwright: ${{ matrix.browser == 'webkit' }}
      maven-args: >-
        -P${{ matrix.browser == 'webkit' && 'webkit-tests' || 'showcase-tests' }}${{ matrix.mode == 'production' && ',production' || '' }}
        ${{ matrix.browser == 'firefox' && '-Dmaterial.test.browser=browser-firefox' || '' }}
      timeout-minutes: 60
      # The production Chrome run hands its tested site to the Pages workflow.
      artifact-name: ${{ matrix.mode == 'production' && matrix.browser == 'chrome' && 'showcase-pages' || '' }}
      artifact-path: showcase-teavm/target/site
    secrets: inherit
