name: CI

# Builds and tests the port on the organisation's container runners, which carry
# the browsers the TeaVM tests drive. The parents and teavm-compat resolve from
# packages.instanto.io.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Build the port and run its tests
      goals: clean verify
      timeout-minutes: 45
    secrets: inherit
